[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uketab"
version = "0.1.0"
description = "Offline ukulele tab generator: high-G re-entrant tuning, easy & hard fingerstyle arrangements"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "PyGuitarPro>=0.9",
]

[project.optional-dependencies]
# onnxruntime is the reliable inference backend on modern TensorFlow
# (basic-pitch 0.4's bundled SavedModel predates TF 2.16 loading changes).
audio = ["basic-pitch>=0.4,<0.5", "onnxruntime>=1.17"]
image = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
uketab = "uketab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
